---
- name: Install audit packages
  ansible.builtin.apt:
    name: "{{ auditd_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Configure auditd log management
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: "^#?\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    state: present
  loop:
    - { key: "max_log_file", value: "{{ auditd_max_log_file }}" }
    - { key: "num_logs", value: "{{ auditd_num_logs }}" }
    - { key: "max_log_file_action", value: "{{ auditd_max_log_file_action }}" }
    - { key: "space_left_action", value: "{{ auditd_space_left_action }}" }
    - { key: "admin_space_left_action", value: "{{ auditd_admin_space_left_action }}" }
    - { key: "disk_full_action", value: "{{ auditd_disk_full_action }}" }
  become: true
  notify: Restart auditd

- name: Ensure auditd is running and enabled at boot
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: true
  become: true
