---
# Ubuntu includes /etc/ssh/sshd_config.d/*.conf from the top of sshd_config,
# and OpenSSH keeps the FIRST value it reads. Cloud-init and waagent drop
# files there that override the main file, so the hardened values have to be
# written to a fragment that sorts before theirs.
- name: Enforce hardened SSH settings ahead of vendor drop-ins
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      PermitRootLogin {{ ssh_permit_root_login }}
      PasswordAuthentication {{ ssh_password_authentication }}
      PubkeyAuthentication {{ ssh_pubkey_authentication }}
      MaxAuthTries {{ ssh_max_auth_tries }}
      X11Forwarding {{ ssh_x11_forwarding }}
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  notify: Restart sshd
- name: Apply SSH daemon hardening settings
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?{{ item.key }}\\s"
    line: "{{ item.key }} {{ item.value }}"
    state: present
    validate: "/usr/sbin/sshd -t -f %s"
  loop:
    - { key: "PermitRootLogin", value: "{{ ssh_permit_root_login }}" }
    - { key: "MaxAuthTries", value: "{{ ssh_max_auth_tries }}" }
    - { key: "X11Forwarding", value: "{{ ssh_x11_forwarding }}" }
    - { key: "PasswordAuthentication", value: "{{ ssh_password_authentication }}" }
    - { key: "PubkeyAuthentication", value: "{{ ssh_pubkey_authentication }}" }
  become: true
  notify: Restart sshd
